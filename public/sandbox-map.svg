<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Top face: bright teal-cyan -->
    <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34EED4"/>
      <stop offset="100%" stop-color="#10B9A0"/>
    </linearGradient>
    <!-- Left face: mid teal-blue -->
    <linearGradient id="gLeft" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0B7A6A"/>
      <stop offset="100%" stop-color="#075C50"/>
    </linearGradient>
    <!-- Right face: dark navy -->
    <linearGradient id="gRight" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#053E36"/>
      <stop offset="100%" stop-color="#02241E"/>
    </linearGradient>
    <!-- Top face inner glow -->
    <radialGradient id="gGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Drop shadow group -->
  <g filter="url(#shadow)">
    <!-- Right face (darkest) -->
    <polygon points="16,17 29,10.5 29,23.5 16,30" fill="url(#gRight)"/>
    <!-- Left face (medium) -->
    <polygon points="3,10.5 16,17 16,30 3,23.5" fill="url(#gLeft)"/>
    <!-- Top face (lightest) -->
    <polygon points="16,3 29,10.5 16,17 3,10.5" fill="url(#gTop)"/>
  </g>

  <!-- Inner glow on top face -->
  <polygon points="16,3 29,10.5 16,17 3,10.5" fill="url(#gGlow)"/>

  <!-- Map grid lines on top face (subtle) -->
  <line x1="3"  y1="10.5" x2="29" y2="10.5" stroke="#ADFFF0" stroke-width="0.55" opacity="0.55"/>
  <line x1="16" y1="3"    x2="16" y2="17"   stroke="#ADFFF0" stroke-width="0.55" opacity="0.55"/>

  <!-- Top face outline (highlight) -->
  <polygon points="16,3 29,10.5 16,17 3,10.5"
           fill="none" stroke="#6EFEE7" stroke-width="0.7" stroke-linejoin="round" opacity="0.75"/>

  <!-- Left face bottom + right edge -->
  <line x1="3"  y1="10.5" x2="3"  y2="23.5" stroke="#0A6657" stroke-width="0.6" opacity="0.7"/>
  <line x1="3"  y1="23.5" x2="16" y2="30"   stroke="#0A6657" stroke-width="0.6" opacity="0.6"/>
  <!-- Right face bottom + left edge -->
  <line x1="29" y1="10.5" x2="29" y2="23.5" stroke="#041F1A" stroke-width="0.6" opacity="0.7"/>
  <line x1="29" y1="23.5" x2="16" y2="30"   stroke="#041F1A" stroke-width="0.6" opacity="0.6"/>
  <!-- Center vertical edge -->
  <line x1="16" y1="17"   x2="16" y2="30"   stroke="#0D5E52" stroke-width="0.6" opacity="0.8"/>
</svg>
