name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App · MCP · Electron · Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
            cloud/package-lock.json

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix mcp
          npm ci --no-audit --no-fund --prefix cloud

      - name: Type-check
        run: |
          npx tsc -p tsconfig.json
          npx tsc --noEmit -p mcp/tsconfig.json
          npm run typecheck --prefix cloud

      - name: Unit tests (app, MCP, Worker protocol, Electron sync)
        run: npm run test:all

      - name: Build renderer (Electron + web)
        run: |
          npx vite build
          npx vite build --mode web

      - name: Build MCP server + vault lint self-check
        # The CLI runs over the lint fixture vault written to disk. The fixture deliberately contains
        # errors, so `--fail-on error` must exit 1 — this proves the CI gate itself works.
        run: |
          npm run build --prefix mcp
          node mcp/scripts/fixture-vault.mjs "$RUNNER_TEMP/lint-fixture"
          if node mcp/dist/src/cli/lint.js --vault "$RUNNER_TEMP/lint-fixture" --format md --fail-on error --no-snapshot > lint-report.md; then
            echo "expected the fixture vault to fail the lint" && exit 1
          fi
          head -20 lint-report.md

      - name: Worker bundle (offline dry run)
        working-directory: cloud
        run: npx wrangler deploy --dry-run --outdir dist-dry

  bot:
    name: Slack/Telegram bot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Install
        working-directory: bot
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Compile all Python
        run: python -m compileall -q bot tools scripts backend
      - name: Bot tests
        working-directory: bot
        run: python -m pytest tests -q

  # ── Deploy (main only) ──────────────────────────────────────────────────────
  # The Worker is deployed by GitHub Actions after the test jobs pass. The web app is deployed
  # by Vercel's own Git integration (import the repo in Vercel; vercel.json carries the build).
  #
  # Repository secrets needed: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, D1:Edit, Workers R2
  # Storage:Edit, Vectorize:Edit, Queues:Edit, Workers KV Storage:Edit), CLOUDFLARE_ACCOUNT_ID.
  # Optional: CLOUDFLARE_D1_ID to override the database id committed in wrangler.toml (forks).
  # The R2 bucket, Vectorize index, KV namespace and both queues must exist (README "Team sync"
  # commands) or `wrangler deploy` fails binding validation.
  # Worker secrets (TEAM_TOKEN, ANTHROPIC_API_KEY) are set once with `wrangler secret put`, not here.
  deploy-worker:
    name: Deploy Worker
    needs: [app, bot]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund --prefix cloud
      - name: Override the D1 database id (optional)
        # wrangler.toml carries the team's database id (not a secret). Set CLOUDFLARE_D1_ID to
        # point a fork at its own database without editing the file.
        if: env.D1_ID != ''
        working-directory: cloud
        run: sed -i -E "s/^database_id = \".*\"/database_id = \"$D1_ID\"/" wrangler.toml
        env:
          D1_ID: ${{ secrets.CLOUDFLARE_D1_ID }}
      - name: Apply D1 migrations
        working-directory: cloud
        run: npx wrangler d1 migrations apply strata-sync-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        working-directory: cloud
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke
        # Set the repository variable WORKER_URL (https://<worker>.workers.dev) to verify the new
        # version answers /health (no token needed). Skipped when the variable is absent.
        if: vars.WORKER_URL != ''
        run: curl -fsS "${{ vars.WORKER_URL }}/health"
