# Strata Sync cloud — team vault sync API + nightly batch.
#
#   npx wrangler d1 create strata-sync-db        → paste database_id below
#   npx wrangler r2 bucket create strata-vault
#   npx wrangler secret put TEAM_TOKEN            → shared team token (any long random string)
#   npx wrangler d1 migrations apply strata-sync-db --remote
#   npx wrangler deploy
name = "strata-sync-cloud"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[r2_buckets]]
binding = "VAULT"
bucket_name = "strata-vault"

[[d1_databases]]
binding = "DB"
database_name = "strata-sync-db"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

[vars]
# Largest single file accepted by PUT /v1/file (bytes). Images in design vaults rarely exceed this.
MAX_FILE_BYTES = "10485760"

# ── Nightly batch: lint report + embeddings. 19:00 UTC = 04:00 Asia/Seoul. ──
[triggers]
crons = ["0 19 * * *"]

# Optional — semantic search. Without these two bindings the batch still lints, just no embeddings.
#   npx wrangler vectorize create strata-vault-vectors --dimensions=1024 --metric=cosine
[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORS"
index_name = "strata-vault-vectors"

# ── R2 event bridge: files written straight to the bucket (Obsidian Remotely Save) get indexed. ──
#   npx wrangler queues create strata-vault-events
#   npx wrangler r2 bucket notification create strata-vault --event-type object-create --event-type object-delete --queue strata-vault-events
[[queues.consumers]]
queue = "strata-vault-events"
max_batch_size = 50
max_batch_timeout = 5
