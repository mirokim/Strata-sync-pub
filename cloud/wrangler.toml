# Strata Sync cloud — team vault sync API + nightly batch.
#
#   npx wrangler d1 create strata-sync-db        → paste database_id below
#   npx wrangler r2 bucket create strata-vault
#   npx wrangler secret put TEAM_TOKEN            → shared team token (any long random string)
#   npx wrangler d1 migrations apply strata-sync-db --remote
#   npx wrangler deploy
name = "strata-sync-cloud"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[r2_buckets]]
binding = "VAULT"
bucket_name = "strata-vault"

[[d1_databases]]
binding = "DB"
database_name = "strata-sync-db"
database_id = "794343d3-268f-4601-8f63-8e831633dd6f"
migrations_dir = "migrations"

[vars]
# Largest single file accepted by PUT /v1/file (bytes). Images in design vaults rarely exceed this.
MAX_FILE_BYTES = "10485760"
# Zone used to date the nightly report file name.
REPORT_TIMEZONE = "Asia/Seoul"
REACTION_MODEL = "claude-opus-5"
REACTION_FOLDERS = ""
# Documents (re)embedded per nightly run; the index is checkpointed so a cut-off run resumes next time.
EMBED_MAX_DOCS = "150"
# Browser origins of the web app (Vercel). `*` while the API is token-protected and origins are not final.
ALLOWED_ORIGINS = "https://strata-sync-nine.vercel.app,http://localhost:4188,http://localhost:5277,http://127.0.0.1:4188"
# Google accounts allowed to sign in, by e-mail domain (comma-separated). Empty = anyone with a Google account.
ALLOWED_EMAIL_DOMAINS = ""

# The nightly batch parses every document and runs Louvain. On the Workers Paid plan raise the CPU
# budget with the block below; the Free plan rejects `[limits]` entirely (and caps CPU at 10 ms,
# which is enough for the API but not for the nightly lint of a large vault).
[limits]
cpu_ms = 300000

# ── Nightly batch: lint report + embeddings. 19:00 UTC = 04:00 Asia/Seoul. ──
[triggers]
crons = ["0 19 * * *"]

# Optional — semantic search. Without these two bindings the batch still lints, just no embeddings.
#   npx wrangler vectorize create strata-vault-vectors --dimensions=1024 --metric=cosine
# OAuth state, dynamically registered clients, grants and tokens (Google sign-in + MCP clients)
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "398d4d30a29e4d33b1d3545ab9f85c3b"

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORS"
index_name = "strata-vault-vectors"

# ── R2 event bridge: files written straight to the bucket (Obsidian Remotely Save) get indexed. ──
#   npx wrangler queues create strata-vault-events
#   npx wrangler r2 bucket notification create strata-vault --event-type object-create --event-type object-delete --queue strata-vault-events
[[queues.consumers]]
queue = "strata-vault-events"
max_batch_size = 50
max_batch_timeout = 5

# ── AI member reactions on save (optional). Needs the queue and the API key secret:
#   npx wrangler queues create strata-reactions
#   npx wrangler secret put ANTHROPIC_API_KEY
# One LLM call per member whose scope covers the saved document, once per document version, with a
# 6-hour cooldown per path. REACTION_FOLDERS limits which folders qualify (default: all folders
# not starting with `_` or `.`). Members are configured in the app (Settings → AI Members).
[[queues.producers]]
binding = "REACTION_QUEUE"
queue = "strata-reactions"

[[queues.consumers]]
queue = "strata-reactions"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 3

# Per-document coordination for conditional API/MCP writes across Worker isolates.
[[durable_objects.bindings]]
name = "VAULT_WRITER"
class_name = "VaultWriter"

[[migrations]]
tag = "v1-vault-writer"
new_sqlite_classes = ["VaultWriter"]
